{% extends 'adminbase.html' %}
{% load static%}
{% block admin %}

<div class="row mt-4">
    <div class="col-sm-8 mx-auto">

        <div class="card p-4 shadow">

            <h3 class="text-center">
                Add File Attachment
            </h3>

            <p>
                File No: {{ file.file_no }}
            </p>

            <p>
                Title: {{ file.title }}
            </p>

            <form method="post"
                  enctype="multipart/form-data">

                {% csrf_token %}

                <label class="form-label">
                    Select Attachment
                </label>

                <input type="file"
                       name="file_attachment"
                       class="form-control"
                       required>

                <button type="submit"
                        class="btn btn-success mt-3">
                    Upload Attachment
                </button>

            </form>

        </div>

    </div>
</div>

{% endblock %}

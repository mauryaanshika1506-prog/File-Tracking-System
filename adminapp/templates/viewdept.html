 {% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<div class="container-fluid mt-4">

    <div class="card shadow-lg border-0">

        <div class="card-header text-white" 
             style="background-color:rgb(189, 177, 162) ">

            <div class="d-flex justify-content-between align-items-center">
                <h3 class="mb-0">🏢 Department List</h3>

                <a href="{% url 'adddept' %}" class="btn btn-light fw-bold">
                    ➕ Add Department
                </a>
            </div>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover table-bordered align-middle">

                    <thead style="background-color:rgb(189, 177, 162)">
                        <tr>
                            <th>S.No.</th>
                            <th>Department Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody->

                        {% for d in depts %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ d.dept_name }}</td>
                            <td>
                                <a href="{% url 'deldept' did=d.id %}" class="btn btn-danger"><i class="ti ti-trash"></i></a>
                            </td>
                        </tr>

                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-center text-danger fw-bold">
                                No Department Found
                            </td>
                        </tr>
                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
